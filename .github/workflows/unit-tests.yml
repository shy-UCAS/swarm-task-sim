name: Multi-UAV logic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: Multi-UAV SimpleGC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Multi-UAV SimpleGC/requirements.txt
            Multi-UAV SimpleGC/requirements-dev.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run logic tests (no SITL launch)
        run: python -m unittest discover -s tests -v
