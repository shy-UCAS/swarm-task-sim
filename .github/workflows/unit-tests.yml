name: Multi-UAV logic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: Multi-UAV SimpleGC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Multi-UAV SimpleGC/requirements.txt
            Multi-UAV SimpleGC/requirements-dev.txt
      - name: Reject changed files larger than 5 MiB
        working-directory: .
        env:
          SIZE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $base = $env:SIZE_BASE_SHA
          if ($base -and $base -notmatch '^0+$') {
            git fetch --no-tags --depth=1 origin $base
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            # Save the parent before a depth-1 fetch can make HEAD shallow.
            $previous = git rev-parse --verify 'HEAD^' 2>$null
            $hasPrevious = $LASTEXITCODE -eq 0
            git fetch --no-tags --depth=1 origin $env:DEFAULT_BRANCH
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $base = git rev-parse FETCH_HEAD
            if ($base -eq (git rev-parse HEAD)) {
              $base = $previous
              if (-not $hasPrevious) {
                # Empty-tree hash also covers a repository's very first commit.
                $base = python -c "import subprocess; print(subprocess.check_output(['git', 'hash-object', '-w', '-t', 'tree', '--stdin'], input=b'').decode().strip())"
              }
            }
          }
          python .github/scripts/check_file_sizes.py --base $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run archive-independent logic tests (no SITL launch)
        # Historical integration cases require the separate frozen evidence archive.
        run: |
          $env:PYTHONPATH = 'tests'
          $modules = @(
            'test_ordered_route_progress_v2', 'test_patrol_revisit_v2',
            'test_quality', 'test_observation_processing_v3',
            'test_public_scene', 'test_dataset_audit_v3', 'test_protocol_v3',
            'test_wp_l_templates', 'test_wp_l_facts', 'test_mission_data',
            'test_mission_evaluation', 'test_execution_metrics', 'test_route_timing',
            'test_run_provenance', 'test_publication_runtime',
            'test_parallel_batch', 'test_parallel_worker', 'test_parallel_finalize',
            'test_parallel_file_sizes'
          )
          python -m unittest -v @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
